name: Template stability
on:
  pull_request:
    paths:
      - tooling/scripts/init-workspace.mjs
      - tooling/scripts/init-workspace.test.mjs
      - .monoplate/**
      - package.json
      - pnpm-lock.yaml
  push:
    branches: [develop, release]

permissions:
  contents: read

jobs:
  initializer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 11.24.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:initializer
