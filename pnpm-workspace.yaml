packages:
  - apps/*
  - domains/*
  - packages/*

allowBuilds:
  '@sentry/cli': true
  dtrace-provider: false
  esbuild: true
  protobufjs: true
  sharp: true

catalog:
  typescript: ^7.0.2
  zod: ^4.6.4

overrides:
  'query-string>decode-uri-component': 0.5.0
  undici: 7.29.0

minimumReleaseAgeExclude:
  - eas-cli@24.6.0
  - '@expo/cli@57.0.25'
  - '@expo/router-server@57.0.10'
  - babel-preset-expo@57.0.12
  - expo@57.0.23
